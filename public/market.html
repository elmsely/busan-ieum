<!-- public/market.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부산이음 - 우리기장 소식</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Noto Sans KR Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <script src="components.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Noto Sans KR"', 'sans-serif'] },
                    colors: { 
                        rosegold: { 
                            50: '#fff0f0', 100: '#ffe4e6', 200: '#fecdd3', 300: '#fda4af', 
                            400: '#fb7185', 500: '#e58e8e', 600: '#d97777', 700: '#be123c', 800: '#6c4a4a' 
                        } 
                    }
                }
            }
        }
    </script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #FAFAFA; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col relative">

    <public-nav active="market"></public-nav>

    <main class="flex-1 pt-16 sm:pt-20 animate-[fadeIn_0.4s_ease-out]">
        
        <section class="bg-gradient-to-r from-[#FAD0B9] via-[#FFC4D9] to-[#FCA8D0] pt-12 pb-24 sm:pt-16 sm:pb-28 px-4 sm:px-6 relative overflow-hidden text-center">
            <div class="max-w-7xl mx-auto relative z-10">
                <span class="inline-block px-3 py-1 bg-white/70 backdrop-blur-sm rounded-full text-xs font-bold text-gray-800 mb-3 shadow-sm">기장 이웃 소식통</span>
                <h2 class="text-3xl sm:text-4xl lg:text-5xl font-black text-gray-900 mb-3 tracking-tight">우리기장 소식</h2>
                <p class="text-sm sm:text-base text-gray-800 font-medium break-keep">이웃들이 직접 추천하는 카페, 맛집, 나들이 명소를 둘러보고 클릭해서 전체 이야기를 확인해 보세요.</p>
            </div>
        </section>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 -mt-10 sm:-mt-14 relative z-20 mb-16 sm:mb-20">
            <div class="space-y-8 sm:space-y-12">
                
                <!-- 1. 추천 카페 -->
                <div class="bg-white p-6 sm:p-8 md:p-10 rounded-[2rem] shadow-sm border border-gray-100">
                    <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-100">
                        <div class="flex items-center gap-2.5">
                            <div class="w-10 h-10 rounded-xl bg-yellow-50 flex items-center justify-center text-yellow-600">
                                <i data-lucide="coffee" class="w-5 h-5"></i>
                            </div>
                            <h3 class="text-xl sm:text-2xl font-black text-gray-900">추천 카페</h3>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 sm:gap-6" id="market-list-cafe">
                        <div class="col-span-full py-12 text-center text-gray-400 font-medium text-sm">소식을 불러오는 중입니다...</div>
                    </div>
                </div>

                <!-- 2. 동네 맛집 -->
                <div class="bg-white p-6 sm:p-8 md:p-10 rounded-[2rem] shadow-sm border border-gray-100">
                    <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-100">
                        <div class="flex items-center gap-2.5">
                            <div class="w-10 h-10 rounded-xl bg-pink-50 flex items-center justify-center text-pink-600">
                                <i data-lucide="utensils" class="w-5 h-5"></i>
                            </div>
                            <h3 class="text-xl sm:text-2xl font-black text-gray-900">동네 맛집</h3>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 sm:gap-6" id="market-list-food">
                        <div class="col-span-full py-12 text-center text-gray-400 font-medium text-sm">소식을 불러오는 중입니다...</div>
                    </div>
                </div>

                <!-- 3. 관광 & 나들이 -->
                <div class="bg-white p-6 sm:p-8 md:p-10 rounded-[2rem] shadow-sm border border-gray-100">
                    <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-100">
                        <div class="flex items-center gap-2.5">
                            <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center text-blue-600">
                                <i data-lucide="map-pin" class="w-5 h-5"></i>
                            </div>
                            <h3 class="text-xl sm:text-2xl font-black text-gray-900">관광 & 나들이</h3>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 sm:gap-6" id="market-list-tour">
                        <div class="col-span-full py-12 text-center text-gray-400 font-medium text-sm">소식을 불러오는 중입니다...</div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <public-footer></public-footer>
    <public-modals></public-modals>

    <!-- 소식 등록 모달 -->
    <div id="modal-register" class="fixed inset-0 bg-black/60 z-[140] hidden flex items-center justify-center p-4 backdrop-blur-md transition-all">
        <div class="bg-white w-full max-w-xl rounded-[2rem] p-6 sm:p-8 shadow-2xl relative max-h-[90vh] overflow-y-auto hide-scrollbar">
            <button onclick="closeRegisterModal()" class="absolute top-5 right-5 text-gray-400 hover:text-gray-900 transition p-1">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <h3 class="text-xl sm:text-2xl font-black text-gray-900 mb-5 mt-1 flex items-center gap-2">
                <i data-lucide="pen-tool" class="text-rosegold-500 w-5 h-5"></i> 동네 소식 전하기
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs sm:text-sm font-bold text-gray-700 mb-1">소식 사진 첨부</label>
                    <p class="text-[11px] text-rosegold-500 font-bold mb-2">※ 사진을 첨부하시면 이웃들이 더 많이 관심을 가져요!</p>
                    <button type="button" onclick="document.getElementById('post-photo-input').click()" class="w-full h-40 bg-gray-50 border-2 border-dashed border-gray-200 rounded-2xl flex flex-col items-center justify-center text-gray-400 hover:bg-gray-100 hover:border-gray-400 transition group overflow-hidden relative shadow-inner">
                        <i data-lucide="camera" class="w-8 h-8 mb-1 group-hover:scale-110 transition-transform"></i>
                        <span class="font-bold text-xs sm:text-sm">사진 선택하기</span>
                        <img id="post-photo-preview" class="absolute inset-0 w-full h-full object-cover hidden" alt="미리보기">
                    </button>
                    <input type="file" id="post-photo-input" class="hidden" accept="image/*">
                </div>

                <div>
                    <label class="block text-xs sm:text-sm font-bold text-gray-700 mb-1.5">카테고리 선택</label>
                    <select id="post-category" class="w-full p-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:border-gray-900 outline-none font-bold text-sm">
                        <option value="cafe">☕ 분위기 좋은 카페 추천</option>
                        <option value="food">🍽️ 맛있는 동네 맛집 추천</option>
                        <option value="tour">🌳 산책/나들이 좋은 곳 추천</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs sm:text-sm font-bold text-gray-700 mb-1.5">제목</label>
                    <input type="text" id="post-title" placeholder="소식 제목을 적어주세요" class="w-full p-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:border-gray-900 outline-none font-bold text-sm">
                </div>
                <div>
                    <label class="block text-xs sm:text-sm font-bold text-gray-700 mb-1.5">상세 이야기</label>
                    <textarea id="post-content" rows="5" placeholder="이웃들에게 추천하고 싶은 이유, 위치, 팁 등 자세한 이야기를 적어주세요." class="w-full p-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:border-gray-900 outline-none resize-none text-sm leading-relaxed"></textarea>
                </div>
                <button type="button" onclick="submitPost()" class="w-full bg-gray-900 text-white font-black text-base sm:text-lg py-4 rounded-2xl hover:bg-gray-800 transition shadow-md active:scale-95 mt-2">
                    소식 등록 완료
                </button>
            </div>
        </div>
    </div>

    <!-- 소식 수정 모달 -->
    <div id="modal-edit-market" class="fixed inset-0 bg-black/60 z-[160] hidden flex items-center justify-center p-4 backdrop-blur-md transition-all">
        <div class="bg-white w-full max-w-xl rounded-[2rem] p-6 sm:p-8 shadow-2xl relative max-h-[90vh] overflow-y-auto hide-scrollbar animate-[fadeIn_0.3s_ease-out]">
            <button onclick="closeEditMarketModal()" class="absolute top-5 right-5 text-gray-400 hover:text-gray-900 transition p-1">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <h3 class="text-xl sm:text-2xl font-black text-gray-900 mb-5 mt-1 flex items-center gap-2">
                <i data-lucide="edit-3" class="text-blue-500 w-5 h-5"></i> 동네 소식 수정하기
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs sm:text-sm font-bold text-gray-700 mb-1">사진 변경 (선택사항)</label>
                    <p class="text-[11px] text-gray-400 font-medium mb-2">※ 사진을 바꿀 때만 클릭해 주세요. 그대로 두면 기존 사진이 유지됩니다.</p>
                    <button type="button" onclick="document.getElementById('edit-market-photo-input').click()" class="w-full h-40 bg-gray-50 border-2 border-dashed border-gray-200 rounded-2xl flex flex-col items-center justify-center text-gray-400 hover:bg-gray-100 transition group overflow-hidden relative shadow-inner">
                        <i data-lucide="image" class="w-8 h-8 mb-1 group-hover:scale-110 transition-transform"></i>
                        <span class="font-bold text-xs sm:text-sm">사진 바꾸기</span>
                        <img id="edit-market-photo-preview" class="absolute inset-0 w-full h-full object-cover hidden" alt="미리보기">
                    </button>
                    <input type="file" id="edit-market-photo-input" class="hidden" accept="image/*">
                </div>

                <div>
                    <label class="block text-xs sm:text-sm font-bold text-gray-700 mb-1.5">카테고리</label>
                    <select id="edit-market-category" class="w-full p-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:border-gray-900 outline-none font-bold text-sm">
                        <option value="cafe">☕ 분위기 좋은 카페 추천</option>
                        <option value="food">🍽️ 맛있는 동네 맛집 추천</option>
                        <option value="tour">🌳 산책/나들이 좋은 곳 추천</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs sm:text-sm font-bold text-gray-700 mb-1.5">제목</label>
                    <input type="text" id="edit-market-title" class="w-full p-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:border-gray-900 outline-none font-bold text-sm">
                </div>
                <div>
                    <label class="block text-xs sm:text-sm font-bold text-gray-700 mb-1.5">상세 이야기</label>
                    <textarea id="edit-market-content" rows="5" class="w-full p-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:border-gray-900 outline-none resize-none text-sm leading-relaxed"></textarea>
                </div>
                <button type="button" onclick="submitEditMarket()" class="w-full bg-blue-600 text-white font-black text-base sm:text-lg py-4 rounded-2xl hover:bg-blue-700 transition shadow-md active:scale-95 mt-2">
                    수정 내용 저장하기 💾
                </button>
            </div>
        </div>
    </div>

    <!-- 상세 모달 (작성자/관리자 전용 [수정] & [삭제] 버튼 연동) -->
    <div id="modal-detail" class="fixed inset-0 bg-black/60 z-[150] hidden flex items-center justify-center p-4 backdrop-blur-md transition-all">
        <div class="bg-white w-full max-w-2xl rounded-[2rem] shadow-2xl relative max-h-[92vh] flex flex-col overflow-hidden animate-[fadeIn_0.3s_ease-out]">
            <button onclick="closeDetailModal()" class="absolute top-4 right-4 z-20 bg-white/80 backdrop-blur-md text-gray-600 hover:text-gray-900 rounded-full p-2 transition shadow-sm">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <div class="overflow-y-auto flex-1 hide-scrollbar">
                <div class="w-full h-64 sm:h-80 bg-gray-100 relative overflow-hidden">
                    <img id="detail-image" src="" class="w-full h-full object-cover">
                    <div class="absolute bottom-3 left-4 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-bold text-gray-800 shadow-sm" id="detail-category-badge">
                        카테고리
                    </div>
                </div>

                <div class="p-6 sm:p-8">
                    <div class="flex items-center gap-2 text-xs text-gray-400 font-medium mb-2">
                        <span id="detail-author" class="font-bold text-gray-700">작성자</span>
                        <span>•</span>
                        <span id="detail-date">작성일</span>
                    </div>

                    <h3 id="detail-title" class="text-xl sm:text-2xl font-black text-gray-900 mb-4 leading-snug break-keep">
                        제목
                    </h3>

                    <div class="p-4 bg-gray-50 rounded-2xl border border-gray-100 mb-6">
                        <p id="detail-content" class="text-sm sm:text-base text-gray-700 leading-relaxed whitespace-pre-line font-medium break-keep">
                            본문 내용
                        </p>
                    </div>

                    <div class="flex flex-col sm:flex-row items-center justify-between gap-3 pt-4 border-t border-gray-100">
                        <button type="button" onclick="closeDetailModal()" class="w-full sm:w-auto px-6 py-3 bg-gray-100 text-gray-700 rounded-xl font-bold text-sm hover:bg-gray-200 transition">
                            닫기
                        </button>
                        <div id="market-owner-actions" class="w-full sm:w-auto flex items-center justify-end gap-2">
                            <button type="button" onclick="openEditMarketModal()" class="flex-1 sm:flex-none px-4 py-3 bg-white border border-gray-300 text-gray-700 rounded-xl font-bold text-sm hover:bg-gray-50 transition flex items-center justify-center gap-1.5 shadow-sm">
                                <i data-lucide="edit-3" class="w-4 h-4 text-blue-500"></i> 소식 수정
                            </button>
                            <button type="button" onclick="deleteMarketAction()" class="flex-1 sm:flex-none px-4 py-3 bg-red-50 border border-red-200 text-red-600 rounded-xl font-bold text-sm hover:bg-red-100 transition flex items-center justify-center gap-1.5 shadow-sm">
                                <i data-lucide="trash-2" class="w-4 h-4"></i> 소식 삭제
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, auth, appId } from './firebase-config.js';
        import { onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let currentPostImageData = null;
        let currentEditPostImageData = null;
        let currentViewingMarketId = null;
        window.marketItemsCache = {};

        lucide.createIcons();

        // 정식 회원 세션을 덮어쓰지 않도록 안전하게 대기 후 비로그인 시에만 익명 읽기 권한 연결
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                setTimeout(() => {
                    if (!auth.currentUser) {
                        signInAnonymously(auth).catch(() => {});
                    }
                }, 800);
            }
        });

        window.openRegisterModal = () => { 
            if (!auth.currentUser || auth.currentUser.isAnonymous) { 
                alert("소식을 올리시려면 먼저 로그인해 주세요! 😊"); 
                if (window.openLoginModal) window.openLoginModal(); 
            } else { 
                document.getElementById('modal-register').classList.remove('hidden'); 
            }
        };

        window.closeRegisterModal = () => { 
            document.getElementById('modal-register').classList.add('hidden'); 
            currentPostImageData = null;
            const preview = document.getElementById('post-photo-preview');
            if (preview) { preview.src = ''; preview.classList.add('hidden'); }
            document.getElementById('post-photo-input').value = '';
        };

        window.openEditMarketModal = () => {
            if (!currentViewingMarketId || !window.marketItemsCache[currentViewingMarketId]) return;
            const item = window.marketItemsCache[currentViewingMarketId];

            document.getElementById('edit-market-title').value = item.title || '';
            document.getElementById('edit-market-category').value = item.category || 'cafe';
            document.getElementById('edit-market-content').value = item.content || '';

            currentEditPostImageData = null;
            const preview = document.getElementById('edit-market-photo-preview');
            if (item.imageUrl && item.imageUrl.trim().length > 10) {
                preview.src = item.imageUrl;
                preview.classList.remove('hidden');
            } else {
                preview.src = '';
                preview.classList.add('hidden');
            }
            document.getElementById('edit-market-photo-input').value = '';

            document.getElementById('modal-edit-market').classList.remove('hidden');
        };

        window.closeEditMarketModal = () => {
            document.getElementById('modal-edit-market').classList.add('hidden');
            currentEditPostImageData = null;
        };

        window.openDetailModal = (id) => {
            const item = window.marketItemsCache[id];
            if (!item) return;

            currentViewingMarketId = id;

            document.getElementById('detail-title').textContent = item.title || '제목 없음';
            document.getElementById('detail-content').textContent = item.content || '내용이 없습니다.';
            document.getElementById('detail-author').textContent = (item.authorName || '이웃') + ' 님';
            
            let dateText = '최근 소식';
            if (item.createdAt && item.createdAt.toDate) {
                const d = item.createdAt.toDate();
                dateText = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
            }
            document.getElementById('detail-date').textContent = dateText;

            const catMap = { cafe: '☕ 카페 추천', food: '🍽️ 맛집 추천', tour: '🌳 나들이 추천' };
            document.getElementById('detail-category-badge').textContent = catMap[item.category] || '소식';

            const fallback = getFallbackImage(item.category);
            const imgSrc = (item.imageUrl && item.imageUrl.trim().length > 10) ? item.imageUrl : fallback;
            const imgEl = document.getElementById('detail-image');
            imgEl.src = imgSrc;
            imgEl.onerror = () => { imgEl.src = fallback; };

            const user = auth.currentUser;
            const actionBox = document.getElementById('market-owner-actions');
            if (actionBox) {
                if (user && !user.isAnonymous && (item.authorId === user.uid || user.email === 'admin@internal.system')) {
                    actionBox.classList.remove('hidden');
                } else {
                    actionBox.classList.add('hidden');
                }
            }

            document.getElementById('modal-detail').classList.remove('hidden');
            lucide.createIcons();
        };

        window.closeDetailModal = () => {
            document.getElementById('modal-detail').classList.add('hidden');
        };

        const compressImageFile = (file, callback) => {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.82));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        document.getElementById('post-photo-input').addEventListener('change', (e) => {
            compressImageFile(e.target.files[0], (compressedData) => {
                currentPostImageData = compressedData;
                const preview = document.getElementById('post-photo-preview');
                preview.src = compressedData;
                preview.classList.remove('hidden');
            });
        });

        document.getElementById('edit-market-photo-input').addEventListener('change', (e) => {
            compressImageFile(e.target.files[0], (compressedData) => {
                currentEditPostImageData = compressedData;
                const preview = document.getElementById('edit-market-photo-preview');
                preview.src = compressedData;
                preview.classList.remove('hidden');
            });
        });

        window.submitPost = async () => {
            const user = auth.currentUser; 
            if(!user || user.isAnonymous) return alert("로그인이 필요합니다.");
            
            const titleVal = document.getElementById('post-title').value.trim();
            const categoryVal = document.getElementById('post-category').value;
            const contentVal = document.getElementById('post-content').value.trim();
            
            if(!titleVal || !contentVal) { return alert("제목과 상세 이야기를 모두 적어주세요! ✍️"); }
            
            try {
                const savedName = localStorage.getItem('busan_ieum_user_name') || user.displayName || "이웃";
                const postPayload = { 
                    title: titleVal, 
                    category: categoryVal, 
                    content: contentVal, 
                    imageUrl: currentPostImageData || '',
                    authorName: savedName, 
                    authorId: user.uid, 
                    createdAt: serverTimestamp(), 
                    likes: 0, 
                    status: 'active' 
                };

                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'market'), postPayload);
                
                closeRegisterModal(); 
                alert("✅ 소식이 성공적으로 등록되었습니다!");
                document.getElementById('post-title').value = ''; 
                document.getElementById('post-content').value = '';
            } catch(e) { 
                alert("등록 중 오류가 발생했습니다."); 
                console.error(e); 
            }
        };

        window.submitEditMarket = async () => {
            if (!currentViewingMarketId) return;

            const title = document.getElementById('edit-market-title').value.trim();
            const category = document.getElementById('edit-market-category').value;
            const content = document.getElementById('edit-market-content').value.trim();

            if (!title || !content) return alert("제목과 내용을 모두 적어주세요!");

            try {
                const updateData = {
                    title,
                    category,
                    content,
                    updatedAt: serverTimestamp()
                };

                if (currentEditPostImageData) {
                    updateData.imageUrl = currentEditPostImageData;
                }

                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'market', currentViewingMarketId), updateData);
                
                alert("✅ 소식이 성공적으로 수정되었습니다!");
                closeEditMarketModal();

                window.marketItemsCache[currentViewingMarketId] = {
                    ...window.marketItemsCache[currentViewingMarketId],
                    ...updateData
                };
                window.openDetailModal(currentViewingMarketId);
            } catch (err) {
                console.error(err);
                alert("수정 중 오류가 발생했습니다. 권한을 확인해 주세요.");
            }
        };

        window.deleteMarketAction = async () => {
            if (!currentViewingMarketId) return;

            if (!confirm("정말 이 동네 소식을 삭제하시겠습니까?\n삭제된 내용은 복구할 수 없습니다.")) {
                return;
            }

            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'market', currentViewingMarketId));
                alert("🗑️ 소식이 성공적으로 삭제되었습니다.");
                currentViewingMarketId = null;
                closeDetailModal();
            } catch (err) {
                console.error(err);
                alert("삭제 권한이 없거나 오류가 발생했습니다.");
            }
        };

        const getFallbackImage = (cat) => {
            if (cat === 'cafe') return 'https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=800';
            if (cat === 'food') return 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800';
            return 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800';
        };

        const marketRef = collection(db, 'artifacts', appId, 'public', 'data', 'market');
        onSnapshot(marketRef, (snapshot) => {
            const lists = { cafe: [], food: [], tour: [] };
            window.marketItemsCache = {};
            
            snapshot.forEach(docSnap => { 
                const data = docSnap.data(); 
                if (data.status !== 'hidden' && data.status !== 'deleted') { 
                    const itemData = { id: docSnap.id, ...data };
                    window.marketItemsCache[docSnap.id] = itemData;
                    if (lists[data.category]) { 
                        lists[data.category].push(itemData); 
                    }
                } 
            });

            Object.keys(lists).forEach(cat => {
                const container = document.getElementById(`market-list-${cat}`);
                if (!container) return;
                
                if (lists[cat].length === 0) {
                    container.innerHTML = '<div class="col-span-full py-12 text-center text-gray-400 font-medium text-sm">등록된 소식이 없습니다. 첫 번째 이야기를 남겨보세요!</div>';
                } else {
                    container.innerHTML = lists[cat].map(item => {
                        const fallback = getFallbackImage(cat);
                        const validImageUrl = (item.imageUrl && item.imageUrl.trim().length > 10) ? item.imageUrl : fallback;

                        return `
                        <div onclick="openDetailModal('${item.id}')" class="group cursor-pointer bg-white rounded-2xl overflow-hidden border border-gray-100 hover:border-rosegold-300 hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex flex-col h-full">
                            <div class="w-full aspect-[4/3] bg-gray-100 overflow-hidden relative flex-shrink-0">
                                <img src="${validImageUrl}" onerror="this.onerror=null; this.src='${fallback}';" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                <div class="absolute top-2.5 right-2.5 bg-black/50 backdrop-blur-sm text-white px-2 py-0.5 rounded-lg text-[10px] font-bold">
                                    자세히 보기 🔍
                                </div>
                            </div>
                            <div class="p-4 sm:p-5 flex flex-col flex-1">
                                <h4 class="font-black text-base text-gray-900 group-hover:text-rosegold-600 transition truncate mb-1.5">${item.title}</h4>
                                <p class="text-xs text-gray-500 leading-relaxed line-clamp-2 mb-3 font-medium flex-1">${item.content}</p>
                                <div class="flex items-center justify-between pt-3 border-t border-gray-100 mt-auto text-[11px] text-gray-400 font-bold">
                                    <span>${item.authorName || '이웃'} 님</span>
                                    <span class="text-rosegold-500 font-extrabold">전체 읽기 →</span>
                                </div>
                            </div>
                        </div>
                    `}).join('');
                }
            });
            
            lucide.createIcons();
        });
        
    </script>
</body>
</html>
